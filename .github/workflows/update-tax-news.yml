name: Update GST & Income Tax News

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * *"

permissions:
  contents: write

jobs:
  update-tax-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install parser
        run: pip install beautifulsoup4
      - name: Fetch official updates and rebuild page
        run: python scripts/update-tax-news.py
      - name: Commit changes
        run: |
          git config user.name "K&J Co Tax Updates Bot"
          git config user.email "actions@users.noreply.github.com"
          git add tax-updates.html
          git diff --cached --quiet || git commit -m "chore: refresh tax updates"
          git push
